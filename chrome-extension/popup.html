<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RacketPro Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 140px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-title { font-weight: 700; font-size: 14px; color: #f1f5f9; }
    .header-sub { color: #475569; font-size: 11px; margin-top: 2px; }
    .content { padding: 12px; max-height: 420px; overflow-y: auto; }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 8px;
    }
    .track {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 7px;
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .track-label { font-weight: 600; color: #93c5fd; font-size: 13px; }
    .track-badge {
      background: #0f2547;
      color: #3b82f6;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .track-actions { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1d4ed8; color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-secondary { background: #334155; color: #94a3b8; flex: 0; padding: 7px 12px; }
    .btn-secondary:hover:not(:disabled) { background: #475569; }
    .turbo-bar {
      background: #150e00;
      border-bottom: 1px solid #1e293b;
      padding: 9px 12px;
      margin: -12px -12px 12px;
    }
    .turbo-text { font-size: 11px; color: #a16207; line-height: 1.4; }
    .progress-bg { background: #0f172a; border-radius: 3px; height: 3px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .tip {
      background: #1c1917;
      border: 1px solid #292524;
      border-radius: 7px;
      padding: 10px;
      margin-top: 8px;
      font-size: 11px;
      color: #a8a29e;
      line-height: 1.5;
    }
    .tip strong { color: #d4a574; }
    .tip code {
      display: block;
      margin-top: 6px;
      background: #0c1a0f;
      color: #86efac;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-family: monospace;
      white-space: pre;
    }
    .empty {
      text-align: center;
      padding: 28px 16px;
      color: #475569;
    }
    .empty-icon { font-size: 30px; margin-bottom: 10px; }
    .empty-title { font-weight: 700; font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
    .empty-desc { font-size: 12px; line-height: 1.6; }
    .open-btn {
      display: inline-block;
      margin-top: 12px;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .footer {
      padding: 10px 12px;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status { flex: 1; font-size: 11px; color: #475569; }
    .footer-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #64748b;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 11px;
    }
    .footer-btn:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>
    <div>
      <div class="header-title">RacketPro Downloader</div>
      <div class="header-sub" id="subtitle">Detecting videos...</div>
    </div>
  </div>
  <div id="content" class="content">
    <div class="empty">
      <div class="empty-icon">⏳</div>
      <div class="empty-title">Loading...</div>
    </div>
  </div>
  <div class="footer">
    <span id="status"></span>
    <button class="footer-btn" id="btn-clear">Clear</button>
    <button class="footer-btn" id="btn-refresh">Refresh</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
